<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fun()">onclick</button>
    <button ondblclick="fun()">ondblclick</button>

    <input type="text" onfocus="fun()" placeholder="onfocus">
    <input type="text" onchange="fun()" placeholder="onchange">
    <input type="text" onblur="fun()" placeholder="onblur">
    <input type="text" oninput="fun()" placeholder="oninput">

    <input type="text" onmousedown="fun()" placeholder="onmousedown">
    <input type="text" onmouseup="fun()" placeholder="onmouseup">
    <input type="text" onmouseenter="fun()" placeholder="onmouseenter">
    <input type="text" onmouseover="fun()" placeholder="onmouseover">
    <input type="text" onmouseleave="fun()" placeholder="onmouseleave">
    <input type="text" onmouseout="fun()" placeholder="onmouseout">
    <input type="text" onmousewheel="fun()" placeholder="onmousewheel">
    <input type="text" onmousemove="fun()" placeholder="onmousemove">
    <input type="text" ="fun()" placeholder="onfocus">
<script>  
        function fun(){
            document.writeln("hello")
        }
        
 </script>
      
      
        
    
</body>
</html>
